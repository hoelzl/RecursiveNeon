name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=recursive_neon --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
        if: always()

  parity:
    name: Editor Parity (Emacs)
    # Pinned runner image (not -latest) so the distro emacs-nox stays at a
    # known version: Emacs behaviour drifts across releases, and the
    # EXPECTED_DIVERGENCES baselines were validated against GNU Emacs 29.3
    # (Ubuntu 24.04). Bump deliberately, re-validating the baselines.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          emacs --version | head -1

      - name: Install dependencies
        run: pip install -e "./backend[dev]" pyte pexpect

      - name: Parity unit tests (verdict logic)
        run: python -m pytest parity/tests -q -o addopts=""

      - name: Run parity scenarios
        env:
          # targets.py defaults to <repo>/.venv/bin/python; CI has no venv.
          NEON_PARITY_PYTHON: python
        run: python -m parity.run
